<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f7a3d" />
    <title>Няма връзка — Къде Да</title>
    <link rel="icon" href="/favicon-32x32.png" type="image/png" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #fff;
        color: #1f2937;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 360px;
      }
      img {
        width: 96px;
        height: 96px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 20px;
        color: #4b5563;
        line-height: 1.5;
      }
      button {
        background: #0f7a3d;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="Къде Да" width="96" height="96" />
      <h1>Няма връзка с интернет</h1>
      <p>
        Докладите се зареждат в реално време, затова са нужни интернет. Проверете връзката си и
        опитайте отново.
      </p>
      <button type="button" onclick="location.reload()">Опитай отново</button>
    </main>
  </body>
</html>
